
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知公告</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 24px 16px;
    background: #f3f5f8;
    color: #252b36;
    font-family: "Microsoft YaHei", sans-serif;
}

.container {
    max-width: 850px;
    margin: 30px auto;
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.05);
}

.header {
    text-align: center;
    border-bottom: 1px solid #eee;
    padding-bottom: 24px;
}

.header h1 {
    font-size: 27px;
    margin: 0 0 18px;
    color: #202b3c;
}

.meta {
    color: #9299a5;
    font-size: 13px;
}

.content {
    padding: 30px 4px;
    font-size: 16px;
    line-height: 2;
    min-height: 200px;
}

.content p {
    text-indent: 2em;
    margin: 12px 0;
}

.notice {
    background: #fff8e9;
    border-left: 4px solid #e9a23b;
    padding: 14px 18px;
    margin: 20px 0;
    border-radius: 4px;
}

.footer {
    border-top: 1px solid #eee;
    padding-top: 20px;
    text-align: right;
    color: #777;
    line-height: 1.8;
    font-size: 14px;
}

@media(max-width:600px) {
    body { padding: 10px; }
    .container {
        margin: 10px auto;
        padding: 24px 18px;
    }
    .header h1 { font-size: 22px; }
    .content { font-size: 15px; }
}
</style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>关于有关事项的通知</h1>
        <div class="meta">
            发布时间：2026年11月18日　
            <span>通知公告</span>
        </div>
    </div>

    <div class="content">
        <p>孙燕你好：</p>

        <p>
            关于你骗人一事，我个人非常讨厌骗子，如果你有了解计算机的话，我有你的手机号，
            从而能推出你的身份证，家庭地址，以及你父母兄弟姐妹的联系方式，我希望你能给与合理的处理方式，避免事情的进一步发展，
            我无法预知自己会做出哪些不理智的事情，我也实在不想，但是有时候越想越气，谁的钱都不是大风刮来的，说好的为什么要骗人呢。
        </p>

        <div class="notice">
            <strong>重要提醒：</strong>
            请孙燕认真阅读通知内容！！！
        </div>

        <p>
        </p>
    </div>

    <div class="footer">
        <div>通知发布单位</div>
        <div>2026年11月18日</div>
    </div>

</div>
</body>
</html>
